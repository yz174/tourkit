<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>tourkit e2e</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; font-family: system-ui, sans-serif; padding: 24px; }
      #hero { display: block; margin: 16px 0; padding: 12px 20px; }
      #scroller { height: 240px; overflow-y: auto; border: 1px solid #ccc; width: 300px; }
      .row { padding: 12px; border-bottom: 1px solid #eee; }
      #modal { position: fixed; right: 24px; bottom: 24px; z-index: 500; background: #fff;
               border: 1px solid #999; padding: 20px; }
      #history-scroller { height: 200px; overflow-y: auto; border: 1px solid #ccc; width: 260px; }
      .history-row { padding: 10px; border-bottom: 1px solid #eee; }
      #spacer { height: 1200px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="spacer"></div>
    <script type="module" src="./bundle.js"></script>
  </body>
</html>
